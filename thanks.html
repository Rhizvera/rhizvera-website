<!DOCTYPE html>
<html lang="en">
<head>
<script async src="https://www.googletagmanager.com/gtm.js?id=GTM-W5VX366B"></script>
<script>window.dataLayer = window.dataLayer || []; function gtag(){dataLayer.push(arguments);} gtag('js', new Date());</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request received | Rhizvera</title>
<meta name="robots" content="noindex">
<meta name="description" content="The Rhizvera Staffing Risk Intelligence (SRI) Platform brings classification, payroll exposure, claims and workforce communication together for staffing companies and the carriers, captives and programs that insure them.">
<link rel="icon" type="image/png" href="rhizvera-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #172B5C;      /* logo navy: headings */
    --root: #23736E;     /* logo teal, deepened for readable links and buttons */
    --teal: #45A9A1;     /* logo teal: diagram strands */
    --gold: #EBBC58;     /* logo centre node */
    --root-dark: #1B5C58;
    --paper: #FBFCFC;    /* page */
    --sage: #E8F2F1;     /* pale teal: quiet section ground */
    --text: #2B3035;     /* body */
    --muted: #5B6670;
    --line: #C8D8D6;
    --measure: 36rem;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--text);
    font: 400 1.0625rem/1.6 "Public Sans", system-ui, sans-serif;
  }
  a { color: var(--root); }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--root); outline-offset: 3px; }
  .wrap { max-width: 72rem; margin: 0 auto; padding: 0 1.5rem; }

  header.site { padding: 1.5rem 0; }
  header.site .wrap { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .wordmark { font: 500 1.5rem/1 "Newsreader", Georgia, serif; color: var(--ink); text-decoration: none; letter-spacing: .01em; }
  .wordmark img { height: 4rem; width: auto; display: block; }
  @media (max-width: 520px) { .wordmark img { height: 2.5rem; } }
  .header-link { font-weight: 600; font-size: .95rem; text-decoration: none; color: var(--root); border-bottom: 2px solid transparent; }
  .header-link:hover { border-bottom-color: var(--root); }

  h1, h2 { font-family: "Newsreader", Georgia, serif; font-weight: 400; color: var(--ink); margin: 0; }
  h1 { font-size: clamp(2.5rem, 5.5vw, 4.25rem); line-height: 1.04; letter-spacing: -.015em; max-width: 13ch; }
  h2 { font-size: clamp(1.75rem, 3vw, 2.375rem); line-height: 1.15; max-width: 22ch; }
  p { margin: 0 0 1rem; max-width: var(--measure); }

  /* Hero: words left, the rhizome right */
  .hero { padding: 3rem 0 4.5rem; }
  .hero .wrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 3rem; align-items: center; }
  .hero .lede { font-size: 1.25rem; line-height: 1.55; color: var(--text); margin-top: 1.5rem; }
  .hero .sub { color: var(--muted); }
  .button {
    display: inline-block; margin-top: 1rem;
    background: var(--root); color: #fff; text-decoration: none;
    font-weight: 600; padding: .85rem 1.4rem; border-radius: 3px;
  }
  .button:hover { background: var(--root-dark); }
  .rhizome { width: 100%; height: auto; display: block; }
  .rhizome .node-label { font: 500 13px "Public Sans", sans-serif; fill: var(--muted); }
  .rhizome .hub-label { font: 500 15px "Newsreader", serif; fill: var(--paper); }
  .rhizome .strand { fill: none; stroke: var(--teal); stroke-width: 2; stroke-linecap: round;
    stroke-dasharray: 600; stroke-dashoffset: 600; animation: grow 1.6s ease-out forwards; }
  .rhizome .strand.s2 { animation-delay: .15s; } .rhizome .strand.s3 { animation-delay: .3s; }
  .rhizome .strand.s4 { animation-delay: .45s; } .rhizome .strand.s5 { animation-delay: .6s; }
  .rhizome .strand.s6 { animation-delay: .75s; }
  .rhizome .fine { fill: none; stroke: var(--line); stroke-width: 1.25; }
  @keyframes grow { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) { .rhizome .strand { animation: none; stroke-dashoffset: 0; } }

  section.band { padding: 4.5rem 0; }
  section.band.sage { background: var(--sage); }
  .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 3rem; align-items: start; }

  .audiences { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .audiences li { padding: 1.1rem 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 14rem 1fr; gap: 1.5rem; }
  .audiences strong { color: var(--ink); font-weight: 600; }
  .audiences span { color: var(--muted); }

  .roles { border-left: 4px solid var(--root); padding: .25rem 0 .25rem 1.75rem; }
  .roles p { font-family: "Newsreader", Georgia, serif; font-size: clamp(1.35rem, 2.2vw, 1.7rem); line-height: 1.4; color: var(--ink); max-width: 34ch; margin: 0; }

  .steps { list-style: none; counter-reset: step; margin: 2rem 0 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2rem; }
  .steps li { counter-increment: step; border-top: 2px solid var(--ink); padding-top: 1rem; }
  .steps li::before { content: counter(step); display: block; font: 400 2.25rem/1 "Newsreader", serif; color: var(--root); margin-bottom: .75rem; }
  .steps strong { display: block; color: var(--ink); font-weight: 600; margin-bottom: .35rem; }
  .steps span { color: var(--muted); font-size: .975rem; }

  .request .wrap { max-width: 48rem; }
  .form-shell { margin-top: 2rem; background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 1.5rem; min-height: 12rem; }
  .form-fallback { color: var(--muted); }

  footer.site { padding: 2.5rem 0 3rem; border-top: 1px solid var(--line); color: var(--muted); font-size: .9rem; }
  footer.site .wrap { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }

  @media (max-width: 860px) {
    .hero .wrap, .split { grid-template-columns: 1fr; gap: 2rem; }
    .steps { grid-template-columns: 1fr 1fr; }
    .audiences li { grid-template-columns: 1fr; gap: .25rem; }
  }
  @media (max-width: 520px) { .steps { grid-template-columns: 1fr; } section.band { padding: 3.25rem 0; } }
</style>
</head>
<body>

<header class="site">
  <div class="wrap">
    <a class="wordmark" href="./"><img src="rhizvera-logo.png" alt="Rhizvera: Where Data Becomes Truth" width="720" height="171"></a>
    
  </div>
</header>

<main>
  <section class="band">
    <div class="wrap" style="max-width:48rem">
      <h2>Thank you. We've received your request.</h2>
      <p style="margin-top:1.25rem">We'll review it and, if it's approved, send you an NDA to sign electronically. Submitting this request doesn't grant access to any Rhizvera information.</p>
      <a class="button" href="./">Back to rhizvera.com</a>
    </div>
  </section>
</main>

<footer class="site">
  <div class="wrap">
    <span>© 2026 Rhizvera, Inc.</span>
    <span>Staffing Risk Intelligence · <a href="privacy.html">Privacy</a></span>
  </div>
</footer>

</body>
</html>
